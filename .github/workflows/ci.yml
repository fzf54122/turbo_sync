name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  desktop-gui:
    name: Tauri desktop GUI check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/turbosync-gui/package-lock.json

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/turbosync-gui/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix crates/turbosync-gui ci

      - name: Build frontend
        run: npm --prefix crates/turbosync-gui run build

      - name: Stage desktop sidecars
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p turbosync-cli -p turbosync-agent
          SIDECAR_DIR="crates/turbosync-gui/src-tauri/binaries"
          mkdir -p "${SIDECAR_DIR}"
          cp target/debug/tsync "${SIDECAR_DIR}/tsync-x86_64-unknown-linux-gnu"
          cp target/debug/turbosync-agent "${SIDECAR_DIR}/turbosync-agent-x86_64-unknown-linux-gnu"

      - name: Build desktop GUI
        run: cargo build --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml

      - name: Check GUI formatting
        run: cargo fmt --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml --all --check

      - name: Run GUI clippy
        run: cargo clippy --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run GUI tests
        run: cargo test --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml
