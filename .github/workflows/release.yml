name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            archive: deb
            deb_arch: amd64
          - os: macos-13
            label: macOS x64
            target: x86_64-apple-darwin
            bin_ext: ""
            archive: tar.gz
          - os: macos-latest
            label: macOS ARM64
            target: aarch64-apple-darwin
            bin_ext: ""
            archive: tar.gz
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/turbosync-gui/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            . -> target
            crates/turbosync-gui/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix crates/turbosync-gui ci

      - name: Build frontend
        run: npm --prefix crates/turbosync-gui run build

      - name: Build Linux binaries for Deepin 20.9 compatibility
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            debian:buster-slim \
            bash -c '
              set -euo pipefail
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                "deb http://archive.debian.org/debian-security buster/updates main" \
                > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                libappindicator3-dev \
                libgtk-3-dev \
                librsvg2-dev \
                libssl-dev \
                libwebkit2gtk-4.0-dev \
                patchelf \
                pkg-config \
                upx-ucl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="/root/.cargo/bin:${PATH}"
              rustc --version
              cargo --version
              cargo build --release --target x86_64-unknown-linux-gnu --workspace
              cargo build --release --target x86_64-unknown-linux-gnu --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml

              mkdir -p dist/linux-bin
              copy_binary() {
                name="$1"
                src="$(find target crates/turbosync-gui/src-tauri/target -type f -path "*/release/${name}" -perm -111 | head -n 1)"
                if [ -z "${src}" ]; then
                  echo "Missing Linux release binary: ${name}"
                  find target crates/turbosync-gui/src-tauri/target -maxdepth 5 -type f -path "*/release/*" | sort
                  exit 1
                fi
                strip "${src}" || true
                upx --best --lzma "${src}" || echo "UPX compression skipped for ${src}"
                cp "${src}" "dist/linux-bin/${name}"
              }

              copy_binary tsync
              copy_binary turbosync-agent
              copy_binary tsync-gui
            '

      - name: Build CLI and agent
        if: runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Build native desktop bundles
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            macOS) bundles="app,dmg" ;;
            Windows) bundles="msi" ;;
            *) bundles="none" ;;
          esac
          npm --prefix crates/turbosync-gui run tauri build -- --target ${{ matrix.target }} --bundles "${bundles}" --ci

      - name: Prepare portable package
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          PACKAGE="turbosync-${VERSION}-${{ matrix.target }}"
          MAIN_TARGET="target/${{ matrix.target }}/release"
          GUI_TARGET="crates/turbosync-gui/src-tauri/target/${{ matrix.target }}/release"

          mkdir -p "dist/${PACKAGE}"
          cp "${MAIN_TARGET}/tsync${{ matrix.bin_ext }}" "dist/${PACKAGE}/"
          cp "${MAIN_TARGET}/turbosync-agent${{ matrix.bin_ext }}" "dist/${PACKAGE}/"
          GUI_BINARY="$(find crates/turbosync-gui/src-tauri/target -type f -path "*/release/tsync-gui${{ matrix.bin_ext }}" | head -n 1)"
          if [[ -n "${GUI_BINARY}" ]]; then
            cp "${GUI_BINARY}" "dist/${PACKAGE}/"
          else
            echo "::warning::Portable GUI binary was not found; native app bundle will be used instead."
          fi
          cp README.md LICENSE "dist/${PACKAGE}/"

          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            APP_PATH="$(find "${GUI_TARGET}/bundle/macos" -maxdepth 1 -type d -name "*.app" | head -n 1)"
            if [[ -n "${APP_PATH}" ]]; then
              cp -R "${APP_PATH}" "dist/${PACKAGE}/"
            fi
            cp "${GUI_TARGET}/bundle/dmg/"*.dmg dist/
          fi

      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            DEB_VERSION="${GITHUB_REF_NAME#v}"
          else
            DEB_VERSION="0.1.0+manual.${GITHUB_RUN_NUMBER}"
          fi
          PACKAGE="turbosync_${DEB_VERSION}_${{ matrix.deb_arch }}"
          BINARY_ROOT="dist/linux-bin"
          ROOT="dist/deb/${PACKAGE}"

          mkdir -p \
            "${ROOT}/DEBIAN" \
            "${ROOT}/usr/bin" \
            "${ROOT}/usr/share/applications" \
            "${ROOT}/usr/share/doc/turbosync" \
            "${ROOT}/usr/share/icons/hicolor/256x256/apps"

          install -m 0755 "${BINARY_ROOT}/tsync" "${ROOT}/usr/bin/tsync"
          install -m 0755 "${BINARY_ROOT}/turbosync-agent" "${ROOT}/usr/bin/turbosync-agent"
          install -m 0755 "${BINARY_ROOT}/tsync-gui" "${ROOT}/usr/bin/tsync-gui"
          install -m 0644 README.md LICENSE "${ROOT}/usr/share/doc/turbosync/"
          install -m 0644 crates/turbosync-gui/src-tauri/icons/256x256.png "${ROOT}/usr/share/icons/hicolor/256x256/apps/turbosync.png"

          cat > "${ROOT}/usr/share/applications/turbosync.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=飞梭同步
          Name[en]=TurboSync
          GenericName=Folder Synchronization Tool
          Comment=Synchronize folders across devices
          Exec=/usr/bin/tsync-gui
          TryExec=/usr/bin/tsync-gui
          Icon=turbosync
          Terminal=false
          StartupNotify=true
          Categories=Utility;
          Keywords=sync;synchronize;folder;file;backup;TurboSync;
          DESKTOP

          desktop-file-validate "${ROOT}/usr/share/applications/turbosync.desktop"

          cat > "${ROOT}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTINST

          cat > "${ROOT}/DEBIAN/postrm" <<'POSTRM'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTRM

          chmod 0755 "${ROOT}/DEBIAN/postinst" "${ROOT}/DEBIAN/postrm"

          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: turbosync
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: fengzhanfei
          Depends: desktop-file-utils, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1, librsvg2-2
          Description: 飞梭同步 desktop file synchronization tool
           Includes the tsync CLI, turbosync-agent service, and Tauri desktop GUI.
          EOF

          dpkg-deb --root-owner-group -Zxz --build "${ROOT}" "dist/${PACKAGE}.deb"

      - name: Archive macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          PACKAGE="turbosync-${VERSION}-${{ matrix.target }}"
          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $package = "turbosync-$version-${{ matrix.target }}"
          Copy-Item "crates/turbosync-gui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" -Destination "dist/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbosync-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.dmg
            dist/*.msi
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.dmg
            dist/*.msi
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
