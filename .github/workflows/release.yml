name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
            deb_arch: amd64
            rpm_arch: x86_64
            linux_arch: amd64
          - os: ubuntu-22.04
            label: Linux ARM64
            target: aarch64-unknown-linux-gnu
            bin_ext: ""
            deb_arch: arm64
            rpm_arch: aarch64
            linux_arch: arm64
          - os: ubuntu-22.04
            label: Linux ARMv7
            target: armv7-unknown-linux-gnueabihf
            bin_ext: ""
            deb_arch: armhf
            rpm_arch: armhfp
            linux_arch: armhf
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            bin_ext: ".exe"
          - os: windows-latest
            label: Windows ARM64
            target: aarch64-pc-windows-msvc
            bin_ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/turbosync-gui/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install Linux ARM cross dependencies
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sources.list <<'EOF'
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-security main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-updates main multiverse universe restricted
          deb [arch=amd64,i386] http://archive.ubuntu.com/ubuntu jammy-backports main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main multiverse universe restricted
          deb [arch=armhf,arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main multiverse universe restricted
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list
          sudo dpkg --add-architecture ${{ matrix.linux_arch }}
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev:${{ matrix.linux_arch }} \
            libgtk-3-dev:${{ matrix.linux_arch }} \
            libssl-dev:${{ matrix.linux_arch }} \
            libappindicator3-dev:${{ matrix.linux_arch }} \
            librsvg2-dev:${{ matrix.linux_arch }}
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          else
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            . -> target
            crates/turbosync-gui/src-tauri -> target

      - name: Install frontend dependencies
        run: npm --prefix crates/turbosync-gui ci

      - name: Build frontend
        run: npm --prefix crates/turbosync-gui run build

      - name: Build Linux x64 binaries for Deepin 20.9 compatibility
        if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker pull debian:buster-slim && break || sleep 10
          done
          docker run --rm \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}:/work" \
            -w /work \
            debian:buster-slim \
            bash -c '
              set -euo pipefail
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                "deb http://archive.debian.org/debian-security buster/updates main" \
                > /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                curl \
                libappindicator3-dev \
                libgtk-3-dev \
                librsvg2-dev \
                libssl-dev \
                libwebkit2gtk-4.0-dev \
                patchelf \
                pkg-config \
                upx-ucl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="/root/.cargo/bin:${PATH}"
              rustc --version
              cargo --version
              cargo build --release --target x86_64-unknown-linux-gnu --workspace

              SIDECAR_DIR="crates/turbosync-gui/src-tauri/binaries"
              mkdir -p "${SIDECAR_DIR}"
              cp "target/x86_64-unknown-linux-gnu/release/tsync" "${SIDECAR_DIR}/tsync-x86_64-unknown-linux-gnu"
              cp "target/x86_64-unknown-linux-gnu/release/turbosync-agent" "${SIDECAR_DIR}/turbosync-agent-x86_64-unknown-linux-gnu"

              cargo build --release --target x86_64-unknown-linux-gnu --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml

              mkdir -p dist/linux-bin
              copy_binary() {
                name="$1"
                src="$(find target crates/turbosync-gui/src-tauri/target -type f -path "*/release/${name}" -perm -111 | head -n 1)"
                if [ -z "${src}" ]; then
                  echo "Missing Linux release binary: ${name}"
                  find target crates/turbosync-gui/src-tauri/target -maxdepth 5 -type f -path "*/release/*" | sort
                  exit 1
                fi
                strip "${src}" || true
                upx --best --lzma "${src}" || echo "UPX compression skipped for ${src}"
                cp "${src}" "dist/linux-bin/${name}"
              }

              copy_binary tsync
              copy_binary turbosync-agent
              copy_binary tsync-gui
              chown -R "${HOST_UID}:${HOST_GID}" dist
            '

      - name: Build Linux ARM binaries
        if: runner.os == 'Linux' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
            export PKG_CONFIG_PATH="${PKG_CONFIG_LIBDIR}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
            STRIP=aarch64-linux-gnu-strip
          else
            export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc
            export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
            export PKG_CONFIG_PATH="${PKG_CONFIG_LIBDIR}"
            export PKG_CONFIG_SYSROOT_DIR=/usr/arm-linux-gnueabihf
            STRIP=arm-linux-gnueabihf-strip
          fi
          export PKG_CONFIG_ALLOW_CROSS=1

          cargo build --release --target ${{ matrix.target }} --workspace

          SIDECAR_DIR="crates/turbosync-gui/src-tauri/binaries"
          mkdir -p "${SIDECAR_DIR}"
          cp "target/${{ matrix.target }}/release/tsync" "${SIDECAR_DIR}/tsync-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/turbosync-agent" "${SIDECAR_DIR}/turbosync-agent-${{ matrix.target }}"

          cargo build --release --target ${{ matrix.target }} --manifest-path crates/turbosync-gui/src-tauri/Cargo.toml

          mkdir -p dist/linux-bin
          copy_binary() {
            name="$1"
            src="$(find target crates/turbosync-gui/src-tauri/target -type f -path "*/${{ matrix.target }}/release/${name}" -perm -111 | head -n 1)"
            if [[ -z "${src}" ]]; then
              echo "Missing Linux release binary: ${name}"
              find target crates/turbosync-gui/src-tauri/target -maxdepth 6 -type f -path "*/release/*" | sort
              exit 1
            fi
            "${STRIP}" "${src}" || true
            cp "${src}" "dist/linux-bin/${name}"
          }

          copy_binary tsync
          copy_binary turbosync-agent
          copy_binary tsync-gui

      - name: Build CLI and agent
        if: runner.os == 'Windows'
        run: cargo build --release --target ${{ matrix.target }} --workspace

      - name: Stage desktop sidecars
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          SIDECAR_DIR="crates/turbosync-gui/src-tauri/binaries"
          mkdir -p "${SIDECAR_DIR}"
          cp "target/${{ matrix.target }}/release/tsync${{ matrix.bin_ext }}" "${SIDECAR_DIR}/tsync-${{ matrix.target }}${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/turbosync-agent${{ matrix.bin_ext }}" "${SIDECAR_DIR}/turbosync-agent-${{ matrix.target }}${{ matrix.bin_ext }}"

      - name: Build Windows desktop bundles
        if: runner.os == 'Windows'
        shell: bash
        run: npm --prefix crates/turbosync-gui run tauri build -- --target ${{ matrix.target }} --bundles msi,nsis --ci

      - name: Prepare Windows portable package
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          PACKAGE="turbosync-${VERSION}-${{ matrix.target }}"
          MAIN_TARGET="target/${{ matrix.target }}/release"

          mkdir -p "dist/${PACKAGE}"
          cp "${MAIN_TARGET}/tsync${{ matrix.bin_ext }}" "dist/${PACKAGE}/"
          cp "${MAIN_TARGET}/turbosync-agent${{ matrix.bin_ext }}" "dist/${PACKAGE}/"
          GUI_BINARY="$(find crates/turbosync-gui/src-tauri/target -type f -path "*/release/tsync-gui${{ matrix.bin_ext }}" | head -n 1)"
          if [[ -n "${GUI_BINARY}" ]]; then
            cp "${GUI_BINARY}" "dist/${PACKAGE}/"
          else
            echo "::warning::Portable GUI binary was not found; native app bundle will be used instead."
          fi
          cp README.md LICENSE "dist/${PACKAGE}/"

      - name: Build Debian package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            DEB_VERSION="${GITHUB_REF_NAME#v}"
          else
            DEB_VERSION="0.1.0+manual.${GITHUB_RUN_NUMBER}"
          fi
          PACKAGE="turbosync_${DEB_VERSION}_${{ matrix.deb_arch }}"
          BINARY_ROOT="dist/linux-bin"
          ROOT="dist/deb/${PACKAGE}"

          mkdir -p \
            "${ROOT}/DEBIAN" \
            "${ROOT}/usr/bin" \
            "${ROOT}/usr/share/applications" \
            "${ROOT}/usr/share/doc/turbosync" \
            "${ROOT}/usr/share/icons/hicolor/256x256/apps"

          install -m 0755 "${BINARY_ROOT}/tsync" "${ROOT}/usr/bin/tsync"
          install -m 0755 "${BINARY_ROOT}/turbosync-agent" "${ROOT}/usr/bin/turbosync-agent"
          install -m 0755 "${BINARY_ROOT}/tsync-gui" "${ROOT}/usr/bin/tsync-gui"
          install -m 0644 README.md LICENSE "${ROOT}/usr/share/doc/turbosync/"
          install -m 0644 crates/turbosync-gui/src-tauri/icons/256x256.png "${ROOT}/usr/share/icons/hicolor/256x256/apps/turbosync.png"

          cat > "${ROOT}/usr/share/applications/turbosync.desktop" <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=飞梭同步
          Name[en]=TurboSync
          GenericName=Folder Synchronization Tool
          Comment=Synchronize folders across devices
          Exec=/usr/bin/tsync-gui
          TryExec=/usr/bin/tsync-gui
          Icon=turbosync
          Terminal=false
          StartupNotify=true
          Categories=Utility;
          Keywords=sync;synchronize;folder;file;backup;TurboSync;
          DESKTOP

          desktop-file-validate "${ROOT}/usr/share/applications/turbosync.desktop"

          cat > "${ROOT}/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTINST

          cat > "${ROOT}/DEBIAN/postrm" <<'POSTRM'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q /usr/share/icons/hicolor || true
          fi
          exit 0
          POSTRM

          chmod 0755 "${ROOT}/DEBIAN/postinst" "${ROOT}/DEBIAN/postrm"

          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: turbosync
          Version: ${DEB_VERSION}
          Section: utils
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: fengzhanfei
          Depends: desktop-file-utils, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1, librsvg2-2
          Description: 飞梭同步 desktop file synchronization tool
           Includes the tsync CLI, turbosync-agent service, and Tauri desktop GUI.
          EOF

          dpkg-deb --root-owner-group -Zxz --build "${ROOT}" "dist/${PACKAGE}.deb"

      - name: Build RPM package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          else
            RAW_VERSION="0.1.0"
          fi
          RPM_VERSION="${RAW_VERSION%%[-+]*}"
          RPM_TOPDIR="${PWD}/dist/rpmbuild"
          RPM_SOURCE="${PWD}/dist/rpm-source"
          RPM_ARCH="${{ matrix.rpm_arch }}"

          mkdir -p \
            "${RPM_SOURCE}/usr/bin" \
            "${RPM_SOURCE}/usr/share/applications" \
            "${RPM_SOURCE}/usr/share/doc/turbosync" \
            "${RPM_SOURCE}/usr/share/icons/hicolor/256x256/apps" \
            "${RPM_TOPDIR}/BUILD" \
            "${RPM_TOPDIR}/BUILDROOT" \
            "${RPM_TOPDIR}/RPMS" \
            "${RPM_TOPDIR}/SOURCES" \
            "${RPM_TOPDIR}/SPECS" \
            "${RPM_TOPDIR}/SRPMS"

          install -m 0755 dist/linux-bin/tsync "${RPM_SOURCE}/usr/bin/tsync"
          install -m 0755 dist/linux-bin/turbosync-agent "${RPM_SOURCE}/usr/bin/turbosync-agent"
          install -m 0755 dist/linux-bin/tsync-gui "${RPM_SOURCE}/usr/bin/tsync-gui"
          install -m 0644 README.md LICENSE "${RPM_SOURCE}/usr/share/doc/turbosync/"
          install -m 0644 crates/turbosync-gui/src-tauri/icons/256x256.png "${RPM_SOURCE}/usr/share/icons/hicolor/256x256/apps/turbosync.png"
          cp dist/deb/turbosync_*/usr/share/applications/turbosync.desktop "${RPM_SOURCE}/usr/share/applications/turbosync.desktop"

          tar -C "${RPM_SOURCE}" -czf "${RPM_TOPDIR}/SOURCES/turbosync-files.tar.gz" .
          cat > "${RPM_TOPDIR}/SPECS/turbosync.spec" <<EOF
          Name: turbosync
          Version: ${RPM_VERSION}
          Release: 1%{?dist}
          Summary: 飞梭同步 desktop file synchronization tool
          License: MIT
          BuildArch: ${RPM_ARCH}
          Source0: turbosync-files.tar.gz

          %description
          Includes the tsync CLI, turbosync-agent service, and Tauri desktop GUI.

          %prep
          %setup -q -c -T

          %install
          mkdir -p %{buildroot}
          tar -xzf %{SOURCE0} -C %{buildroot}

          %files
          /usr/bin/tsync
          /usr/bin/turbosync-agent
          /usr/bin/tsync-gui
          /usr/share/applications/turbosync.desktop
          /usr/share/doc/turbosync/README.md
          /usr/share/doc/turbosync/LICENSE
          /usr/share/icons/hicolor/256x256/apps/turbosync.png
          EOF

          rpmbuild -bb --define "_topdir ${RPM_TOPDIR}" "${RPM_TOPDIR}/SPECS/turbosync.spec"
          find "${RPM_TOPDIR}/RPMS" -type f -name '*.rpm' -exec cp {} dist/ \;

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $package = "turbosync-$version-${{ matrix.target }}"
          Copy-Item "crates/turbosync-gui/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" -Destination "dist/"
          Copy-Item "crates/turbosync-gui/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*.exe" -Destination "dist/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbosync-${{ matrix.target }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.msi
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
