[package]
name = "turbosync-gui"
edition = "2021"
license = "MIT"
rust-version = "1.78"
version = "0.1.0"

[workspace]

[[bin]]
name = "tsync-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
slint = "1.16"
tokio = { version = "1.38", features = ["rt-multi-thread"] }
turbosync-core = { path = "../turbosync-core" }
