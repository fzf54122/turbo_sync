[package]
name = "tsync-gui"
edition = "2021"
license = "MIT"
rust-version = "1.78"
version = "0.1.2"
build = "build.rs"

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lib]
name = "turbosync_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "tsync-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
anyhow = "1.0"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1", features = [] }
tokio = { version = "1.38", features = ["rt-multi-thread", "time"] }
turbosync-core = { path = "../../turbosync-core" }
