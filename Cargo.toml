[workspace]
members = [
    "crates/turbosync-agent",
    "crates/turbosync-cli",
    "crates/turbosync-core",
    "crates/turbosync-storage",
    "crates/turbosync-sync",
    "crates/turbosync-transport",
    "crates/turbosync-tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
blake3 = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
notify = "6.1"
quinn = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tokio-stream = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"
crossterm = "0.28"
ratatui = "0.29"
sha2 = "0.10"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
