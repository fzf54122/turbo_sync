[workspace]
members = [
    "crates/turbosync-agent",
    "crates/turbosync-cli",
    "crates/turbosync-core",
    "crates/turbosync-storage",
    "crates/turbosync-sync",
    "crates/turbosync-transport",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.7"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
notify = "6.1"
quinn = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"
